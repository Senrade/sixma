:\"Hackathon prototype\",\"footer.independent\":\"Independent project\",\"footer.explore\":\"Explore\",\"footer.project\":\"Project\",\"footer.achievements\":\"Achievements\",\"footer.eventAccess\":\"Event access\",\"footer.faq\":\"FAQ\",\"footer.privacy\":\"Privacy\",\"footer.terms\":\"Terms\",\"footer.disclaimer\":\"SIXMA is a submission for the 2026 UNESCO Youth Hackathon. It is an independent project, not affiliated with or sponsored by UNESCO.\",\"home.kicker\":\"Media literacy, learned by doing\",\"home.description\":\"An interactive media-literacy game for students, families, and educators. Work through realistic cases before the same pressure appears in real life.\",\"home.playDemo\":\"Play demo\",\"home.openCases\":\"Open case hub\",\"home.redeem\":\"Redeem card\",\"home.whatLabel\":\"What it is\",\"home.whatTitle\":\"Practice the pause before you trust or share\",\"home.whatText\":\"SIXMA turns misinformation patterns into short investigations. Players inspect source material, identify persuasive techniques, and trace how unsupported claims grow.\",\"home.builtFor\":\"Built for\",\"home.students\":\"Students\",\"home.studentsText\":\"Build verification habits before reacting to viral content.\",\"home.families\":\"Families\",\"home.familiesText\":\"Discuss scams, emotional pressure, and suspicious claims together.\",\"home.educators\":\"Educators\",\"home.educatorsText\":\"Use compact cases for guided media-literacy practice.\",\"home.howLabel\":\"How an investigation works\",\"home.step1\":\"Inspect evidence\",\"home.step1Text\":\"Locate visual inconsistencies instead of trusting first impressions.\",\"home.step2\":\"Question the claim\",\"home.step2Text\":\"Mark the exact language that pushes fear or faulty reasoning.\",\"home.step3\":\"Trace the chain\",\"home.step3Text\":\"Rebuild the sequence used to move a person from hook to harm.\",\"home.casesLabel\":\"Case files\",\"home.casesTitle\":\"Start the first investigation\",\"home.browseAll\":\"Browse all\",\"welcome.eyebrow\":\"New signal detected\",\"welcome.title\":\"New here? Start with a demo case.\",\"welcome.description\":\"Take one six-minute investigation and see what your first reaction might miss. No account required.\",\"welcome.play\":\"Begin investigation\",\"welcome.opening\":\"Opening...\",\"welcome.cardPrompt\":\"Have a SIXMA case card? Redeem it to access its investigation.\",\"welcome.redeem\":\"Redeem a card\",\"welcome.about\":\"About SIXMA\",\"welcome.online\":\"Online\",\"demoStory.signal1\":\"Behind the image\",\"demoStory.title1\":\"This rescue photo was not real.\",\"demoStory.body1\":\"The girl and puppy were created with AI. But the picture still reached real people and shaped how they felt about a real disaster.\",\"demoStory.sourceBefore\":\"The story was reported\",\"demoStory.sourceLink\":\"here\",\"demoStory.sourceAfter\":\"by the John S. Knight Journalism Fellowships at Stanford University.\",\"demoStory.signal2\":\"The psychological reaction\",\"demoStory.title2\":\"Was that easy for you to spot?\",\"demoStory.body2\":\"Good eye! But most people don't look closely. This photo tugged at heartstrings and felt believable at a glance. People shared it out of empathy, and that’s precisely what makes manipulation work.\",\"demoStory.signal3\":\"The bigger picture\",\"demoStory.title3\":\"That was just the tip of the iceberg.\",\"demoStory.body3\":\"Spotting one AI photo can be simple. The real danger? Thousands of synthetic images and spun narratives flooding our feeds every day, shaping reality before anyone stops to verify.\",\"demoStory.signal4\":\"SIXMA's Solution\",\"demoStory.title4\":\"A short pause can make a real difference.\",\"demoStory.body4\":\"SIXMA helps you train your critical thinking through a simple habit: pause for a moment, scrutinize the source, check the evidence, and question what is really going on.\",\"demoStory.back\":\"Back\",\"demoStory.continue\":\"Continue\",\"demoStory.feedbackPrompt\":\"Help SIXMA improve:\",\"demoStory.feedbackLink\":\"Open the Feedback form here.\",\"demoStory.explore\":\"Explore SIXMA\",\"demoStory.debrief\":\"D001 | Debrief\",\"demoStory.progressAria\":\"Scene {{current}} of {{total}}\",\"home.faqLabel\":\"Questions and answers\",\"home.faqTitle\":\"Frequently asked questions\",\"home.faqIntro\":\"How case progression, evidence practice, and this independent project work.\",\"faq.whatQuestion\":\"What does SIXMA really do, anyway?\",\"faq.whatAnswer\":\"We use games to help you build a quick habit of pausing, checking sources, and spotting fake news or AI tricks before you hit \\\"Share\\\".\",\"faq.valueQuestion\":\"How does this help me in real life?\",\"faq.valueAnswer\":\"Think of it like a gym for your brain. By practicing on real-world scenarios, you build a habit to spot deepfakes, catch logical fallacies in news or posts, and even see right through scams.\",\"faq.insideQuestion\":\"What is inside the game?\",\"faq.insideAnswer\":\"Spot hidden visual errors in an image, catch logical flaws in a post, and wrap up with an interactive drag-and-drop puzzle. It takes just a couple of minutes to test your instincts and solve the case!\",\"faq.proofQuestion\":\"Does this kind of training actually work?\",\"faq.proofAnswer\":\"Yes! It is based on a proven psychological concept called prebunking. Exposing you to micro-doses of manipulation tactics in a controlled environment builds cognitive skills when you're out in the wild.\",\"faq.proQuestion\":\"Do I really need this if I already check my sources?\",\"faq.proAnswer\":\"Awesome! Since AI and deepfakes are evolving fast, SIXMA is always here whenever you want to keep your skills sharp while scrolling.\",\"cases.kicker\":\"Investigation archive\",\"cases.title\":\"Case hub\",\"cases.intro\":\"Choose a case and work through all three evidence-based modules.\",\"cases.search\":\"Search investigations\",\"cases.searchPlaceholder\":\"Title, case ID, or topic\",\"cases.gameMode\":\"Game mode\",\"ca

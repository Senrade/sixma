s\":\"Terms\",\"footer.disclaimer\":\"SIXMA is a submission for the 2026 UNESCO Youth Hackathon. It is an independent project, not affiliated with or sponsored by UNESCO.\",\"home.kicker\":\"Media literacy, learned by doing\",\"home.description\":\"An interactive media-literacy game for students, families, and educators. Work through realistic cases before the same pressure appears in real life.\",\"home.playDemo\":\"Play demo\",\"home.openCases\":\"Open case hub\",\"home.redeem\":\"Redeem card\",\"home.whatLabel\":\"What it is\",\"home.whatTitle\":\"Practice the pause before you trust or share\",\"home.whatText\":\"SIXMA turns misinformation patterns into short investigations. Players inspect source material, identify persuasive techniques, and trace how unsupported claims grow.\",\"home.builtFor\":\"Built for\",\"home.students\":\"Students\",\"home.studentsText\":\"Build verification habits before reacting to viral content.\",\"home.families\":\"Families\",\"home.familiesText\":\"Discuss scams, emotional pressure, and suspicious claims together.\",\"home.educators\":\"Educators\",\"home.educatorsText\":\"Use compact cases for guided media-literacy practice.\",\"home.howLabel\":\"How an investigation works\",\"home.step1\":\"Inspect evidence\",\"home.step1Text\":\"Locate visual inconsistencies instead of trusting first impressions.\",\"home.step2\":\"Question the claim\",\"home.step2Text\":\"Mark the exact language that pushes fear or faulty reasoning.\",\"home.step3\":\"Trace the chain\",\"home.step3Text\":\"Rebuild the sequence used to move a person from hook to harm.\",\"home.casesLabel\":\"Case files\",\"home.casesTitle\":\"Start the first investigation\",\"home.browseAll\":\"Browse all\",\"welcome.eyebrow\":\"New signal detected\",\"welcome.title\":\"New here? Start with a demo case.\",\"welcome.description\":\"Take one six-minute investigation and see what your first reaction might miss. No account required.\",\"welcome.play\":\"Begin investigation\",\"welcome.opening\":\"Opening...\",\"welcome.cardPrompt\":\"Have a SIXMA case card? Redeem it to access its investigation.\",\"welcome.redeem\":\"Redeem a card\",\"welcome.about\":\"About SIXMA\",\"welcome.online\":\"Online\",\"demoStory.signal1\":\"Behind the image\",\"demoStory.title1\":\"This rescue photo was not real.\",\"demoStory.body1\":\"The girl and puppy were created with AI. But the picture still reached real people and shaped how they felt about a real disaster.\",\"demoStory.sourceBefore\":\"The story was reported\",\"demoStory.sourceLink\":\"here\",\"demoStory.sourceAfter\":\"by the John S. Knight Journalism Fellowships at Stanford University.\",\"demoStory.signal2\":\"The psychological reaction\",\"demoStory.title2\":\"Was that easy for you to spot?\",\"demoStory.body2\":\"Good eye! But most people don't look closely. This photo tugged at heartstrings and felt believable at a glance. People shared it out of empathy, and that’s precisely what makes manipulation work.\",\"demoStory.signal3\":\"The bigger picture\",\"demoStory.title3\":\"That was just the tip of the iceberg.\",\"demoStory.body3\":\"Spotting one AI photo can be simple. The real danger? Thousands of synthetic images and spun narratives flooding our feeds every day, shaping reality before anyone stops to verify.\",\"demoStory.signal4\":\"SIXMA's Solution\",\"demoStory.title4\":\"A short pause can make a real difference.\",\"demoStory.body4\":\"SIXMA helps you train your critical thinking through a simple habit: pause for a moment, scrutinize the source, check the evidence, and question what is really going on.\",\"demoStory.back\":\"Back\",\"demoStory.continue\":\"Continue\",\"demoStory.feedbackPrompt\":\"Help SIXMA improve:\",\"demoStory.feedbackLink\":\"Open the Feedback form here.\",\"demoStory.explore\":\"Explore SIXMA\",\"demoStory.debrief\":\"D001 | Debrief\",\"demoStory.progressAria\":\"Scene {{current}} of {{total}}\",\"home.faqLabel\":\"Questions and answers\",\"home.faqTitle\":\"Frequently asked questions\",\"home.faqIntro\":\"How case progression, evidence practice, and this independent project work.\",\"faq.whatQuestion\":\"What does SIXMA really do, anyway?\",\"faq.whatAnswer\":\"We use games to help you build a quick habit of pausing, checking sources, and spotting fake news or AI tricks before you hit \\\"Share\\\".\",\"faq.valueQuestion\":\"How does this help me in real life?\",\"faq.valueAnswer\":\"Think of it like a gym for your brain. By practicing on real-world scenarios, you build a habit to spot deepfakes, catch logical fallacies in news or posts, and even see right through scams.\",\"faq.insideQuestion\":\"What is inside the game?\",\"faq.insideAnswer\":\"Spot hidden visual errors in an image, catch logical flaws in a post, and wrap up with an interactive drag-and-drop puzzle. It takes just a couple of minutes to test your instincts and solve the case!\",\"faq.proofQuestion\":\"Does this kind of training actually work?\",\"faq.proofAnswer\":\"Yes! It is based on a proven psychological concept called prebunking. Exposing you to micro-doses of manipulation tactics in a controlled environment builds cognitive skills when you're out in the wild.\",\"faq.proQuestion\":\"Do I really need this if I already check my sources?\",\"faq.proAnswer\":\"Awesome! Since AI and deepfakes are evolving fast, SIXMA is always here whenever you want to keep your skills sharp while scrolling.\",\"cases.kicker\":\"Investigation archive\",\"cases.title\":\"Case hub\",\"cases.intro\":\"Choose a case and work through all three evidence-based modules.\",\"cases.search\":\"Search investigations\",\"cases.searchPlaceholder\":\"Title, case ID, or topic\",\"cases.gameMode\":\"Game mode\",\"cases.fullCase\":\"Full case\",\"cases.practice\":\"Module practice\",\"cases.filter\":\"Filter by threat level\",\"cases.comingSoon\":\"Coming soon\",\"cases.practiceTitle\":\"Practice individual modules\",\"cases.practiceText\":\"Module practice unlocks after a full case is complet  families, and educators.\",\"about.section1.title\":\"Why this format\",\"about.section1.body\":\"Misinformation is rarely defeated by memorizing a checklist. Each case asks the learner to inspect evidence, make a judgment, receive feedback, and explain the reasoning behind that judgment.\",\"about.section2.title\":\"Built for practice\",\"about.section2.body\":\"The case structure combines image forensics, rhetorical analysis, and manipulation-chain reconstruction. These skills transfer to suspicious posts, scams, altered media, and high-pressure messages outside the classroom.\",\"about.section3.title\":\"Project status\",\"about.section3.body\":\"This is an independent hackathon prototype. Case questions and learning content remain under review.\",\"contact.eyebrow\":\"Project contact\",\"contact.title\":\"Contact the team\",\"contact.intro\":\"Questions, classroom feedback, and partnership ideas help shape the next version.\",\"contact.send\":\"Send a message\",\"privacy.eyebrow\":\"Prototype policy\",\"privacy.title\":\"Privacy notice\",\"privacy.intro\":\"This notice describes the current static test build, not a future account-enabled production service.\",\"privacy.section1.title\":\"Data stored on this device\",\"privacy.section1.body\":\"The prototype stores case progress, completion times, demo event access, and earned badges in your browser's local storage. This information is not transmitted to a project server by the current application.\",\"privacy.section2.title\":\"Forms and accounts\",\"privacy.section2.body\":\"Account and contact screens are interface previews and do not submit data. Event codes are checked locally against a demo list; the raw code is not retained. Do not enter sensitive information into a prototype.\",\"privacy.section3.title\":\"Third-party hosting\",\"privacy.section3.body\":\"A deployed hosting provider may process standard request information such as IP addresses and browser metadata. A production release must publish the provider, retention period, lawful basis, and user rights before collecting account data.\",\"privacy.section4.title\":\"Before production\",\"privacy.section4.body\":\"This draft must be replaced with a jurisdiction-appropriate privacy policy after the authentication provider, analytics choices, audience age requirements, and data retention rules are finalized.\",\"terms.eyebrow\":\"Prototype terms\",\"terms.title\":\"Terms of use\",\"terms.intro\":\"These plain-language terms apply to the current educational demonstration only.\",\"terms.section1.title\":\"Educational prototype\",\"terms.section1.body\":\"SIXMA provides practice activities and general media-literacy information. It does not certify whether every image, post, or person is authentic.\",\"terms.section2.title\":\"Draft content\",\"terms.section2.body\":\"Cases may contain fictional scenarios and test questions that are not final. Do not present the prototype as a substitute for professional safety advice.\",\"terms.section3.title\":\"Acceptable use\",\"terms.section3.body\":\"Do not attempt to enter another person's private information, disrupt the service, or represent prototype achievements as formal accreditation.\",\"terms.section4.title\":\"Production review\",\"terms.section4.body\":\"A public account-enabled launch requires formal legal review, a support process, age-appropriate consent decisions, and complete operator details.\",\"article.minuteRead\":\"{{minutes}} minute read\",\"article.back\":\"Back to knowledge hub\"},\"children\":\"$L10\"}]}]}]\n11:I[32865,[\"/_next/static/chunks/1bov-oo31_eqc.js\",\"/_next/static/chunks/0qdjfmyz0al22.js\",\"/_next/static/chunks/13fy69y4715s7.js\",\"/_next/static/chunks/2yvgusz0giq8m.js\"],\"SpecialCaseAccessBoundary\"]\n12:I[14995,[\"/_next/static/chunks/1bov-oo31_eqc.js\",\"/_next/static/chunks/0qdjfmyz0al22.js\",\"/_next/static/chunks/13fy69y4715s7.js\",\"/_next/static/chunks/2yvgusz0giq8m.js\"],\"MissionExperience\"]\n13:I[27201,[\"/_next/static/chunk ginal signage or a later overlay?\",\"push_question\":\"$undefined\",\"options\":[\"A. Compare each digit's shape, perspective, and lighting with the others and with older trusted images.\",\"B. Check whether the building commonly displays the new year on its advertising signs.\",\"C. Sharpen the image to see whether the digits become clearer than nearby objects.\"],\"correct_option\":\"A\",\"explanation\":\"An overlay may break shape, perspective, or lighting consistency. Older independent images help test that hypothesis.\"},\"description\":\"The first digit '2' in '2026' is flipped vertically, which is highly illogical compared to the original font.\"},{\"anomaly_id\":\"R005_IMG_02\",\"name\":\"corrupted_billboard_text\",\"x_pct\":76,\"y_pct\":26.4,\"radius_pct\":15,\"socratic_quiz\":{\"question\":\"Which check separates compressed small text from generated or edited text?\",\"push_question\":\"$undefined\",\"options\":[\"A. Compare the board's brightness with other signs in the same scene.\",\"B. Check whether repeated characters keep their shape and form consistent words in the source image.\",\"C. Decide whether the message fits the situation described by the post.\"],\"correct_option\":\"B\",\"explanation\":\"Compression removes detail but does not usually reshape every instance of a character differently. Compare with the source before concluding.\"},\"description\":\"The text contains bizarre spelling errors, with distorted characters in 'STAYIE' and 'SSJCK'.\"},{\"anomaly_id\":\"R005_IMG_03\",\"name\":\"illogical_light_reflection\",\"x_pct\":49.5,\"y_pct\":82.1,\"radius_pct\":15,\"socratic_quiz\":{\"question\":\"Which test best evaluates the red reflection on the street?\",\"push_question\":\"$undefined\",\"options\":[\"A. Trace the reflection's direction and color to a matching light source in the scene.\",\"B. Compare the wet street with the weather forecast for the date claimed by the post.\",\"C. Compare its saturation with the display settings used to view the image.\"],\"correct_option\":\"A\",\"explanation\":\"A reflection should correspond to a source in direction and color. A mismatch is a clue that needs further checking.\"},\"description\":\"The puddle reflects a bright red light, yet there is no corresponding red light source from the surrounding billboards.\"}],\"socratic_quiz\":\"$undefined\"},\"step_2_text_highlight\":{\"mechanic_type\":\"TEXT_HIGHLIGHT\",\"simulated_post\":{\"author\":\"NYC Daily Uncensored\",\"time_posted\":\"15 minutes ago\",\"content\":\"The situation in New York has spiraled into complete chaos. A severe outbreak of a new Corona variant triggered an emergency lockdown across the entire Times Square earlier this morning. Government agencies are deliberately keeping this information hidden, but this photo reveals the full truth. If you don't take action immediately, your family could be caught in the next wave of the pandemic. Everyone needs to share this post with their groups right away to warn the community. Contact your relatives in the US immediately and tell them to stock up on food and cash before it's too late.\"},\"traps\":[{\"trap_id\":\"R005_TRAP_01\",\"ground_truth_start\":187,\"ground_truth_end\":295,\"matched_text\":\"Government agencies are deliberately keeping this information hidden, but this photo reveals the full truth.\",\"weapon_type\":[\"conspiracy_theory\",\"authority_undermining\"],\"socratic_quiz\":{\"question\":\"Which response avoids both blind trust and blanket rejection of official sources?\",\"push_question\":\"$undefined\",\"options\":[\"A. Trust the post when many commenters report similar experiences.\",\"B. Compare its specific claims with primary data and independent sources that explain their methods.\",\"C. Trust the official statement because public agencies always have complete information.\"],\"correct_option\":\"B\",\"explanation\":\"No source should be exempt from scrutiny. Compare specific claims with primary data, methods, and independent reporting.\"}},{\"trap_id\":\"R005_TRAP_02\",\"ground_truth_start\":296,\"ground_truth_end\":395,\"matched_text\":\"If you don't take action immediately, your family could be caught in the next wave of the pandemic.\",\"weapon_type\":[\"appeal_to_fear\",\"emotional_manipulation\"],\"socratic_quiz\":{\"question\":\"Which behavior shows that fear is replacing evaluation of evidence?\",\"push_question\":\"$undefined\",\"options\":[\"A. The reader finds the original report and records what remains uncertain.\",\"B. The reader shares immediately to warn others before checking the source and date.\",\"C. The reader pauses, compares sources, and then decides whether action is needed.\"],\"correct_option\":\"B\",\"explanation\":\"Emotion becomes manipulation when it moves action ahead of verification. That urge is a signal to pause.\"}},{\"trap_id\":\"R005_TRAP_03\",\"ground_truth_start\":482,\"ground_truth_end\":591,\"matched_text\":\"Contact your relatives in the US immediately and tell them to stock up on food and cash before it's too late.\",\"weapon_type\":[\"manufactured_urgency\",\"panic_inducing_action\"],\"socratic_quiz\":{\"question\":\"In what order does the post ask readers to act?\",\"push_question\":\"$undefined\",\"options\":[\"A. Share the warning first, then investigate its source and evidence later.\",\"B. Trace the source, compare evidence, and warn others only if needed.\",\"C. Ask the community, wait for agreement, and treat consensus as verification.\"],\"correct_option\":\"A\",\"explanation\":\"The call reverses the safe order by placing sharing before verification. Urgency does not make evidence more reliable.\"}}]},\"step_3_sorting_game\":{\"mechanic_type\":\"DRAG_AND_DROP_SORTING\",\"context_text\":\"The process by which scammers combine old footage, AI technology, and psychology to create a complete disinformation campaign.\",\"pool_items\":[{\"item_id\":\"R005_SORT_03\",\"text\":\"Draft a post containing sensational words, sow conspiracy theories, and attach the AI-edited photo.\"},{\"item_id\":\"R005_SORT_01\",\"text\":\"Collect a genuine photo of a deserted Times Square taken during the 2020 lockdown.\"},{\"item_id\":\"R005_SORT_04\",\"text\":\"Distribute the post into social media groups to incite people to hoard goods and drive engagement.\"},{\"item_id\":\"R005_SORT_02\",\"text\":\"Use Generative AI tools to change the year from 2020 to 2026 and alter details on the billboards to refresh the image.\"}],\"correct_sequence\":[\"R005_SORT_01\",\"R005_SORT_02\",\"R005_SORT_03\",\"R005_SORT_04\"],\"validation_feedback\":{\"success\":\"Correct! You have completely uncovered the lifecycle of a hybrid scam: Find old footage -\u003e Edit with AI -\u003e Embed psychological traps -\u003e Spread panic.\",\"failure\":\"Not quite the right order. Start with selecting the original photo, then move to AI editing, followed by writing manipulative content, and finally, distribution.\"}}},\"dialogue_trigger\":{\"question\":\"If you see a panic-inducing photo about a global situation, what is your 3-step verification process?\",\"mil_insight\":\"1. Technical Forensics (AI Forensics): Zoom in to find anomalies like distorted text, flipped digits, and illogical reflections.\\n2. Context Verification (Reverse Image Search): Use image search tools to determine when and where the original photo was taken.\\n3. Cross-checking (Official Sources): Verify through statements from authorities or reputable news outlets before sharing.\"}}}]}]\nb:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n8:null\nd:[[\"$\",\"title\",\"0\",{\"children\":\"Mission S005 | SIXMA\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Playable investigations that teach students and families to identify manipulated images, coercive rhetoric, and phishing patterns.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0m88wzozi9rl0.ico\",\"sizes\":\"32x32\",\"type\":\"image/x-icon\"}],[\"$\",\"$L13\",\"3\",{}]]\n"])</script></body></html>
